spring.application.name=bolsines-cu36
server.port=8081
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Base de datos H2 en memoria (igual que el ejemplo java-persistencia de la catedra)
spring.datasource.url=jdbc:h2:mem:bolsinesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# API oficial de la catedra (LiberaeMentis/dsi-api-bolsines) en puerto 8080
gps.api.base-url=http://localhost:8080
